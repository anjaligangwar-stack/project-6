<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="card">
        <h2>BMI Calculator</h2>
        <div class="input-group">
            <label>Height (cm)</label>
            <input type="number" class="height" placeholder="e.g. 170">
        </div>

        <div class="input-group">
            <label>Weight (kg)</label>
            <input type="number" class="weight" placeholder="e.g. 65">
        </div>

        <button class="calsBtn">Calculate BMI</button>

        <div class="result-box">
            <div>Your BMI : <span class="bmi-value"></span></div>
            <div class="status"></div>
        </div>

        <div class="preview">
            <strong>Live Status:</strong>
            <span class="live-text"></span>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
